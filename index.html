еся обязательства. Сам выход из проекта не отменяет уже возникшие обязательства."}, "dom": {"label": "Оплатить остаток ДОМ.РФ", "text": "Оплатить подтверждённый остаток ДОМ.РФ по согласованной схеме. Проверить получателя, сумму и основание платежа. Уже оплаченное повторно не платить."}, "court": {"label": "Суд утвердил мировое Козерога?", "text": "Дождаться решения суда по мировому Козерога. Утверждено — исполняем его условия. Суд отказал — идём в ветку выхода. Если решение ещё ожидается, остаёмся на этом шаге. Если мировое уже утверждено, сразу контролируем срок оплаты."}, "risk": {"label": "ДОМ.РФ оплачен. Суд отказал в мировом Козерога", "text": "Первый платёж сделан, но суд отказал в мировом Козерога. По этой ветке — выход из проекта с отдельным разбором судьбы денег, недостроев и обязательств."}, "exit-paid": {"label": "Выход из проекта", "text": "Завершить участие в проекте. Отдельно согласовать, что происходит с уже перечисленными деньгами, правами на ОНС и оставшимися обязательствами. Возврат денег не считать автоматическим."}, "koz": {"label": "Оплатить остаток Козерогу", "text": "Оплатить подтверждённый остаток Козерогу в срок, установленный судебным актом. Проверить сумму и исполнение условий мирового."}, "rights": {"label": "Закрыть дело МГС и оформить права на ОНС", "text": "Завершить дело МГС по согласованной схеме и оформить либо подтвердить права на каждый недострой. Проверить судебные акты и ЕГРН, чтобы понимать, за кем закреплены объекты."}, "ddu": {"label": "Оформить ДДУ на каждый ОНС", "text": "Сначала с юристом проверить возможность и условия ДДУ по каждому ОНС. Затем оформить ДДУ при наличии необходимых оснований. Сам договор не считать гарантией защиты от Росимущества."}, "lease": {"label": "Получается продлить аренду через ДОМ.РФ?", "text": "Запросить продление по конкретным участкам и получить письменное согласование срока и условий. Если через ДОМ.РФ продлить не получается — переходить к встрече с Росимуществом."}, "rosim-meeting": {"label": "Встреча с Росимуществом: договориться об аренде", "text": "Организовать встречу с Росимуществом. Подготовить документы по недостроям и участкам, обсудить возможность аренды, срок, условия и порядок оформления."}, "rosim-agreed": {"label": "Аренда согласована?", "text": "Проверить, согласованы ли условия аренды и порядок оформления. Договорились — оформляем договор. Если с Росимуществом не удалось договориться — выход из проекта."}, "lease-formal": {"label": "Оформить договор аренды", "text": "Оформить согласованный договор аренды или его продление. Проверить срок, условия и необходимые регистрационные действия. Итог шага — оформленные права на землю."}, "finish": {"label": "Переход к проектированию и РНС", "text": "После оформления необходимых прав и завершения судебных вопросов переходить к проектированию и получению РНС. Это следующий этап проекта."}, "exit-lease": {"label": "Выход из проекта", "text": "Если с Росимуществом не удалось договориться об аренде — завершить участие в проекте. Отдельно урегулировать судьбу оплат, прав на недострои и оставшихся обязательств."}}</script><script>const descriptions=JSON.parse(document.getElementById('descriptions').textContent);

let activeNode=null;
function hideTip(){tip.hidden=true;activeNode=null}
function showTip(node){
  const id=node.dataset.flowNode;
  if(activeNode===id&&!tip.hidden){hideTip();return}
  activeNode=id;
  document.getElementById('tip-title').textContent=descriptions[id].label;
  document.getElementById('tip-text').textContent=descriptions[id].text;
  tip.hidden=false;
  const r=node.getBoundingClientRect(),t=tip.getBoundingClientRect();
  const top=Math.max(document.querySelector('header').getBoundingClientRect().bottom+10,Math.min(r.bottom+10,window.innerHeight-t.height-12));

  tip.style.left=Math.max(12,Math.min(r.left,window.innerWidth-t.width-12))+'px';
}
document.querySelectorAll('[data-flow-node]').forEach(node=>{
  node.addEventListener('click',()=>showTip(node));
  node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showTip(node)}});
});
document.getElementById('tip-close').onclick=hideTip;
document.addEventListener('click',e=>{if(!e.target.closest('[data-flow-node]')&&!e.target.closest('#tip'))hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
window.addEventListener('scroll',hideTip);
window.addEventListener('resize',hideTip);
viewer.addEventListener('scroll',hideTip);
pick.addEventListener('change',hideTip);
</script></body></html>
